<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="results">
    <div class="result-count" th:if="${#lists.isEmpty(individualClients) && #lists.isEmpty(shelters)}">No owners found</div>

    <div class="result-count"
         th:unless="${#lists.isEmpty(individualClients) && #lists.isEmpty(shelters) || truncated}"
         th:text="${(#lists.size(individualClients) + #lists.size(shelters)) + ' ' + 'owner(s) found'}"></div>
    <div class="result-count"
         th:if="${truncated}"
         th:text="${'Showing first ' + (#lists.size(individualClients) + #lists.size(shelters)) + ' ' + ' owner(s) — enter a more specific query'}"></div>

    <div th:unless="${#lists.isEmpty(individualClients)}" class="result-list">
        <div th:each="individualClient : ${individualClients}" class="result-card"
        th:attr="hx-get=@{/pet-owners/{id}/pets(id=${individualClient.id}, veterinarianId=${veterinarianId})}"
             hx-target="#owner-pets-container">
            <div th:text="${individualClient.firstName + ' ' + individualClient.lastName}" class="result-card-title"></div>
            <div th:text="${individualClient.phoneNumber}" class="result-card-line"></div>
            <div th:text="${individualClient.emailAddress}" class="result-card-line"></div>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(shelters)}" class="result-list">
        <div th:each="shelter : ${shelters}" class="result-card"
             th:attr="hx-get=@{/pet-owners/{id}/pets(id=${shelter.id}, veterinarianId=${veterinarianId})}"
            hx-target="#owner-pets-container">
            <div th:text="${shelter.name}" class="result-card-title"></div>
            <div th:text="${#strings.listJoin(shelter.phoneNumbers.stream().limit(3).toList(), ', ') + (shelter.phoneNumbers.size() > 3 ? ' + ' + (shelter.phoneNumbers.size() - 3) + ' more' : '')}" class="result-card-line"></div>
            <div th:text="${shelter.emailAddress}" class="result-card-line"></div>
        </div>
    </div>
</div>
</body>
</html>
