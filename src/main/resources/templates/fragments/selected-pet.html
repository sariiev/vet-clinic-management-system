<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="selectedPet">
    <div class="result-card-title">Pet owner</div>
    <div class="result-card-line" th:text="${pet.ownerName}"></div>
    <div class="result-card-title">Pet</div>
    <div class="result-card-line" th:text="${pet.petName}"></div>
    <input type="hidden" id="selected-pet-id" th:value="${pet.petId}">
</div>
</body>
</html>
