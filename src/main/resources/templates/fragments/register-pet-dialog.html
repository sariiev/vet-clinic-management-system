<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="dialog">
    <div class="modal-overlay" id="nested-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Register new pet</h2>
                <div class="modal-subtitle">Add a new pet to the system</div>
            </div>

            <form class="modal-body register-form"
                  th:attr="hx-post=@{/pets(veterinarianId=${veterinarianId})}"
                  hx-target="#selected-pet-container">
                <input type="hidden" name="ownerId" th:value="${ownerId}">

                <div class="form-row">
                    <label class="form-field">
                        Name *
                        <input type="text" name="name" required>
                    </label>
                </div>

                <div class="form-row">
                    <label class="form-field">
                        Species *
                        <select name="speciesId" required>
                            <option value="">Select species</option>
                            <option th:each="s : ${species}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                    </label>
                </div>

                <div class="form-row">
                    <label class="form-field">
                        Gender *
                        <select name="gender" required>
                            <option value="">Select gender</option>
                            <option th:each="gender : ${T(mas.vetclinic.model.entity.pet.PetGender).values()}" th:value="${gender.name()}" th:text="${gender}"></option>
                        </select>
                    </label>
                </div>

                <div class="form-row">
                    <label class="form-field">
                        Date of birth *
                        <input type="date" name="dateOfBirth" required>
                    </label>
                </div>

                <div class="form-row">
                    <label class="form-field">
                        Chip number
                        <input type="text" name="chipNumber">
                    </label>
                </div>

                <div id="register-error" style="color: red;"></div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancel-nested-button">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="confirm-nested-button">Confirm</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
